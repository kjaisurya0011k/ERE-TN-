server:
  port: 8080

spring:
  application:
    name: ere-tn-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/edunova}
    username: ${DATABASE_USERNAME:edunova}
    password: ${DATABASE_PASSWORD:edunova}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

edunova:
  seed: ${EDUNOVA_SEED:true}
  jwt:
    secret: ${JWT_SECRET:edunova-dev-only-change-me-use-a-256-bit-secret-key!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,https://ere-tn.vercel.app}
  nova-ai:
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gemini-1.5-flash}
    base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    max-tokens: 2048
    temperature: 0.7
